name: PR Python syntax check
on:
  pull_request:
    branches: [main]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile application modules
        run: python -m compileall -q .
      - name: Settings and role permissions smoke test
        env:
          KAKA_DATA_DIR: /tmp/montez-role-settings-test
          KAKA_INITIAL_ADMIN_PASSWORD: Test-Only-Strong-Password-2026
        run: |
          python - <<'PY'
          import os, shutil
          shutil.rmtree(os.environ['KAKA_DATA_DIR'], ignore_errors=True)
          import kaka_core as core
          import kaka_liquor_app as app
          from kaka_liquor_app import save_user, admin_edit_user, layout
          c=core.db.c()
          ts=core.now_str()
          bid=c.execute("INSERT INTO branches(name,code,created_at,updated_at) VALUES(?,?,?,?)",("Role Test Branch","ROLE-01",ts,ts)).lastrowid
          admin_id=c.execute("INSERT INTO users(username,full_name,password_hash,role,access_role,active,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?)",("testadmin","Test Admin",core.sha("admin-test-pass"),"ADMIN","ADMIN",1,ts,ts)).lastrowid
          c.commit(); c.close()
          admin={"id":admin_id,"username":"testadmin","full_name":"Test Admin","access_role":"ADMIN","role":"ADMIN","branch_id":None}
          core.update_settings(admin,{"default_unit":"crate","mpesa_recovery_match_window_minutes":"60","report_default_days":"14","allow_credit_sales":"NO","require_mpesa_code":"NO","subscription_due_day":"10","subscription_first_month":"2027-01","subscription_paybill":"123456","subscription_account":"ABC123","expense_categories":"Rent,Power,Internet","currency":"KES","report_today":"CURRENT DAY","change_reason":"CI settings test"})
          assert core.get_setting("default_unit")=="crate"
          assert core.get_setting("mpesa_recovery_match_window_minutes")=="60"
          assert core.get_setting("subscription_due_day")=="10"
          assert core.get_setting("subscription_first_month")=="2027-01"
          assert core.get_setting("subscription_paybill")=="123456"
          assert core.get_setting("subscription_account")=="ABC123"
          assert core.get_setting("expense_categories")=="Rent,Power,Internet"
          assert app.money(1).startswith("KES ")
          assert "CURRENT DAY" in app.range_toolbar("/ledger","2027-01-01","00:00","2027-01-10","23:59")
          try:
              core.create_sale({"id":admin_id,"username":"testadmin","access_role":"ADMIN","role":"ADMIN"},{"credit":{"due_date":"2027-01-10","collateral":"test"}})
              raise AssertionError("Credit sale was accepted while disabled.")
          except ValueError as e:
              assert "Credit sales are disabled" in str(e)
          c=core.db.c()
          payments=core.validate_payments(c,[{"amount":1,"payment_method":"MPESA","mpesa_code":""}],1)
          c.close()
          assert payments[0]["payment_method"]=="MPESA"
          fd,ft,td,ttime,preset=app.period_from_query({})
          import datetime as dt
          assert (dt.date.fromisoformat(td)-dt.date.fromisoformat(fd)).days==13
          bill=app.subscription_billing_state(dt.date(2027,1,9))
          assert bill["due_month"]=="2027-01" and bill["due_date"]==dt.date(2027,1,10)
          try:
              core.update_settings(admin,{"mpesa_recovery_match_window_minutes":"4","change_reason":"CI invalid range test"})
              raise AssertionError("Invalid M-Pesa recovery window was accepted.")
          except ValueError:
              pass
          manager_id=save_user(admin,{"username":"ci_role_manager","full_name":"CI Role Manager","password":"manager-test-pass","role":"MANAGEMENT","branch_id":""})
          sales_id=save_user(admin,{"username":"ci_role_sales","full_name":"CI Role Sales","password":"sales-test-pass","role":"SALES","branch_id":str(bid)})
          core.update_permissions(admin,{"roles":{"MANAGEMENT":{"VIEW_STOCK":True,"VIEW_REPORTS":False,"MANAGE_SETTINGS":True,"MANAGE_PRODUCTS":True},"SALES":{"CREATE_SALE":True,"MANAGE_USERS":True}},"users":{}})
          manager={"id":manager_id,"username":"ci_role_manager","full_name":"CI Role Manager","access_role":"MANAGEMENT","role":"SALES","branch_id":None}
          sales={"id":sales_id,"username":"ci_role_sales","full_name":"CI Role Sales","access_role":"SALES","role":"SALES","branch_id":bid}
          assert core.effective_permissions(manager)["VIEW_STOCK"] is True
          assert core.effective_permissions(manager)["MANAGE_PRODUCTS"] is True
          app.CURRENT_HANDLER=type("FakeHandler",(),{"headers":{}})()
          assert "SAVE PRODUCT" in app.products_page(manager,query={"branch_id":str(bid)})
          assert core.effective_permissions(manager)["VIEW_REPORTS"] is False
          assert core.effective_permissions(manager)["MANAGE_SETTINGS"] is False
          assert core.effective_permissions(sales)["CREATE_SALE"] is True
          assert core.effective_permissions(sales)["MANAGE_USERS"] is False
          assert "Stock Transfers / Stock Count" in layout(manager,"Test","") 
          assert "Stock Transfers / Stock Count" not in layout(sales,"Test","")
          c=core.db.c()
          c.execute("INSERT INTO user_permissions(user_id,key,enabled) VALUES(?,?,0)",(sales_id,"VIEW_STOCK"))
          c.commit(); c.close()
          admin_edit_user(admin,{"user_id":str(sales_id),"full_name":"CI Role Sales","role":"MANAGEMENT","active":"1","branch_id":str(bid)})
          c=core.db.c()
          row=c.execute("SELECT access_role,branch_id,home_branch_id FROM users WHERE id=?",(sales_id,)).fetchone()
          overrides=c.execute("SELECT COUNT(*) n FROM user_permissions WHERE user_id=?",(sales_id,)).fetchone()["n"]
          c.close()
          assert row["access_role"]=="MANAGEMENT" and row["branch_id"]==bid and row["home_branch_id"]==bid
          assert overrides==0
          changed={"id":sales_id,"username":"sales","full_name":"Sales","access_role":"MANAGEMENT","role":"SALES","branch_id":bid}
          assert core.effective_permissions(changed)["VIEW_STOCK"] is True
          try:
              admin_edit_user(admin,{"user_id":str(sales_id),"full_name":"Sales","role":"MANAGEMENT","active":"1","branch_id":str(bid+100)})
              raise AssertionError("Branch-bound account was moved.")
          except PermissionError:
              pass
          admin_edit_user(admin,{"user_id":str(sales_id),"full_name":"Sales","role":"SALES","active":"1","branch_id":str(bid)})
          # A complete backup must include user login hashes and real business records.
          c=core.db.c()
          c.execute("INSERT INTO products(sku,name,category,unit,sell_price,wholesale_price,avg_cost,stock_qty,reorder_level,active,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)",("CI-SKU-001","CI Backup Product","Test","bottle",100,90,60,5,2,1,core.now_str(),core.now_str()))
          c.commit(); c.close()
          # A backup download must be a readable, integrity-checked SQLite snapshot with a manifest.
          import io, sqlite3, json
          fake=object.__new__(app.Handler)
          fake.send_response=lambda status: None
          fake.send_header=lambda name,value: None
          fake.end_headers=lambda: None
          fake.wfile=io.BytesIO()
          app.Handler.download_backup(fake,admin)
          backup_bytes=fake.wfile.getvalue()
          assert backup_bytes.startswith(b"SQLite format 3\x00")
          backup_files=[os.path.join(os.environ["KAKA_DATA_DIR"],"backups",f) for f in os.listdir(os.path.join(os.environ["KAKA_DATA_DIR"],"backups")) if f.endswith(".db")]
          assert backup_files
          snap=sqlite3.connect(backup_files[-1])
          assert snap.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert snap.execute("SELECT COUNT(*) FROM users").fetchone()[0]>=2
          assert snap.execute("SELECT COUNT(*) FROM products").fetchone()[0]>=1
          manifest=snap.execute("SELECT app_name,login_accounts,business_activity_rows,row_counts_json,integrity_check FROM backup_manifest WHERE id=1").fetchone()
          assert manifest[0]=="MONTEZ LIQUOR" and manifest[1]>=2 and manifest[2]>=1 and manifest[4]=="ok"
          assert json.loads(manifest[3])["products"]>=1
          assert snap.execute("SELECT COUNT(*) FROM users WHERE password_hash IS NULL OR password_hash=''").fetchone()[0]==0
          snap.close()
          # Empty databases must never be presented as complete business backups.
          assert app.backup_readiness({"users":3,"products":0,"sales":0,"purchases":0,"expenses":0})[0] is False
          assert app.backup_readiness({"users":3,"products":1,"sales":0,"purchases":0,"expenses":0})[0] is True
          # M-Pesa callbacks must not mark mismatched amount/phone as paid.
          c=core.db.c()
          c.execute("INSERT INTO mpesa_stk_requests(created_at,user_id,checkout_request_id,client_ref,amount,phone,status,raw_response,updated_at,branch_id) VALUES(?,?,?,?,?,?,?,?,?,?)",(core.now_str(),admin_id,"ci-review-checkout","CI-REVIEW-1",100,"254712345678","PENDING","{}",core.now_str(),bid))
          c.execute("INSERT INTO mpesa_stk_requests(created_at,user_id,checkout_request_id,client_ref,amount,phone,status,raw_response,updated_at,branch_id) VALUES(?,?,?,?,?,?,?,?,?,?)",(core.now_str(),admin_id,"ci-success-checkout","CI-SUCCESS-1",100,"254712345678","PENDING","{}",core.now_str(),bid))
          c.commit(); c.close()
          def stk_callback(checkout,amount,code,phone="254712345678"):
              return {"Body":{"stkCallback":{"CheckoutRequestID":checkout,"MerchantRequestID":"ci-merchant","ResultCode":0,"ResultDesc":"The service request is processed successfully.","CallbackMetadata":{"Item":[{"Name":"Amount","Value":amount},{"Name":"MpesaReceiptNumber","Value":code},{"Name":"PhoneNumber","Value":phone},{"Name":"TransactionDate","Value":20261103101530}]}}}}
          app.mpesa_receive_stk(stk_callback("ci-review-checkout",150,"CIAMT001"))
          c=core.db.c(); assert c.execute("SELECT status FROM mpesa_stk_requests WHERE checkout_request_id='ci-review-checkout'").fetchone()["status"]=="REVIEW"; c.close()
          app.mpesa_receive_stk(stk_callback("ci-success-checkout",100,"CISUCC001"))
          c=core.db.c(); assert c.execute("SELECT status FROM mpesa_stk_requests WHERE checkout_request_id='ci-success-checkout'").fetchone()["status"]=="SUCCESS"; c.close()
          # Professional report export smoke tests: styled/numeric/filterable XLSX and multipage PDF.
          import zipfile, xml.etree.ElementTree as ET, re
          xlsx=core.xlsx_bytes("CI PROFIT AND LOSS",["Item","Amount (KES)","% of Revenue"],[["Sales Revenue",1000.0,100.0],["NET PROFIT / (LOSS)",250.0,25.0]])
          with zipfile.ZipFile(io.BytesIO(xlsx)) as book:
              assert "xl/styles.xml" in book.namelist()
              root=ET.fromstring(book.read("xl/worksheets/sheet1.xml"))
              ns={"x":"http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
              assert root.find("x:autoFilter",ns) is not None
              assert root.find("x:sheetViews/x:sheetView/x:pane",ns) is not None
              assert len(root.findall(".//x:v",ns)) >= 4
          pdf=app.make_pdf("CI STOCK REPORT",["Product","Opening","Purchased","Sold","Closing"],[[f"Test Product {i}",10,2,1,11] for i in range(100)])
          assert pdf.startswith(b"%PDF-1.4")
          assert len(re.findall(rb"/Type /Page\b",pdf)) >= 2
          print("PASS: Settings, permissions, backup integrity, M-Pesa reconciliation, professional Excel exports and multipage PDF reports.")
          PY
