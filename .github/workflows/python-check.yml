name: Python syntax check
on:
  push:
    branches: [main, "fix/settings-permissions-controls-20261103"]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile application modules
        run: python -m compileall -q .
      - name: Branch stock isolation smoke test
        env:
          KAKA_DATA_DIR: /tmp/montez-branch-stock-test
          KAKA_INITIAL_ADMIN_PASSWORD: Test-Only-Strong-Password-2026
        run: |
          python - <<'PY'
          import os, shutil
          shutil.rmtree(os.environ['KAKA_DATA_DIR'], ignore_errors=True)
          import kaka_core as core
          from kaka_liquor_app import save_purchase, save_supplier, stock_transfer_action, stock_count_adjustment, branch_scope_for, save_user, admin_edit_user
          c = core.db.c()
          ts = core.now_str()
          b1 = c.execute("INSERT INTO branches(name,code,created_at,updated_at) VALUES(?,?,?,?)", ("Test Branch A","TSTA",ts,ts)).lastrowid
          b2 = c.execute("INSERT INTO branches(name,code,created_at,updated_at) VALUES(?,?,?,?)", ("Test Branch B","TSTB",ts,ts)).lastrowid
          p = c.execute("INSERT INTO products(sku,name,category,unit,sell_price,wholesale_price,avg_cost,stock_qty,reorder_level,active,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)", ("TEST-001","Test Product","Test","bottle",10,10,5,0,5,1,ts,ts)).lastrowid
          for bid, qty in ((b1,100),(b2,80)):
              c.execute("INSERT INTO branch_stock(branch_id,product_id,qty,avg_cost,buy_price,sell_price,wholesale_price,reorder_level,updated_at) VALUES(?,?,?,?,?,?,?,?,?)", (bid,p,qty,5,5,10,10,5,ts))
          uid = c.execute("INSERT INTO users(username,full_name,password_hash,role,access_role,active,created_at,updated_at,branch_id) VALUES(?,?,?,?,?,?,?,?,?)", ("branchb","Branch B Tester",core.sha("test-password"),"SALES","SALES",1,ts,ts,b2)).lastrowid
          c.commit()
          user = {"id":uid,"branch_id":b2,"username":"branchb","full_name":"Branch B Tester","access_role":"SALES","role":"SALES"}
          assert branch_scope_for(user, {"branch_id":[str(b1)]}) == b2, "Branch staff must not switch branches by query parameter."
          for bid, qty in ((b1,100),(b2,80)):
              c.execute("INSERT INTO stock_movements(movement_time,user_id,product_id,movement_type,qty,before_qty,after_qty,unit_cost,reference,branch_id) VALUES(?,?,?,?,?,?,?,?,?,?)", (ts,uid,p,"OPENING_STOCK",qty,0,qty,5,"TEST OPENING",bid))
          c.commit()
          core.create_sale(user, {"cart":[{"product_id":p,"qty":10}],"payments":[{"amount":100,"payment_method":"CASH","mpesa_code":""}],"customer":{},"sale_type":"RETAIL","branch_id":b1})
          c = core.db.c()
          q1 = c.execute("SELECT qty FROM branch_stock WHERE branch_id=? AND product_id=?",(b1,p)).fetchone()["qty"]
          q2 = c.execute("SELECT qty FROM branch_stock WHERE branch_id=? AND product_id=?",(b2,p)).fetchone()["qty"]
          assert (q1,q2)==(100,70), (q1,q2)
          c.close()
          supplier_id = save_supplier(user, {"name":"Branch B Supplier","phone":"0700000000"})
          c = core.db.c()
          supplier_row = c.execute("SELECT name,branch_id FROM suppliers WHERE id=?",(supplier_id,)).fetchone()
          assert supplier_row["name"]=="Branch B Supplier" and supplier_row["branch_id"]==b2, supplier_row
          c.close()
          save_purchase(user, {"supplier_id":str(supplier_id),"payment_method":"Cash","product_id":str(p),"qty":"5","unit_cost":"7"})
          c = core.db.c()
          q1 = c.execute("SELECT qty FROM branch_stock WHERE branch_id=? AND product_id=?",(b1,p)).fetchone()["qty"]
          q2 = c.execute("SELECT qty FROM branch_stock WHERE branch_id=? AND product_id=?",(b2,p)).fetchone()["qty"]
          assert (q1,q2)==(100,75), (q1,q2)
          c.close()
          report = core.stock_report("1900-01-01 00:00:00","2999-12-31 23:59:59",b2)
          product_row = next(row for row in report if row["sku"]=="TEST-001")
          assert (product_row["opening"],product_row["purchased"],product_row["sold"],product_row["closing"]) == (80,5,10,75), product_row
          today = core.now().strftime("%Y-%m-%d")
          dash = core.dashboard(b2)
          assert abs(float(dash["today_cogs"])-50)<0.01, dash
          assert abs(float(dash["today_gross_profit"])-50)<0.01, dash
          c = core.db.c()
          admin_id = c.execute("INSERT INTO users(username,full_name,password_hash,role,access_role,active,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?)", ("testadmin","Test Admin",core.sha("test-password"),"ADMIN","ADMIN",1,ts,ts)).lastrowid
          c.commit()
          admin = {"id":admin_id,"branch_id":None,"username":"testadmin","full_name":"Test Admin","access_role":"ADMIN","role":"ADMIN"}
          # Verify settings values and range validation.
          core.update_settings(admin, {"default_unit":"crate","mpesa_recovery_match_window_minutes":"60","change_reason":"Automated settings persistence test"})
          assert core.get_setting("default_unit")=="crate"
          assert core.get_setting("mpesa_recovery_match_window_minutes")=="60"
          try:
              core.update_settings(admin, {"mpesa_recovery_match_window_minutes":"4","change_reason":"Invalid range must fail"})
              raise AssertionError("Invalid M-Pesa recovery window was accepted.")
          except ValueError:
              pass
          # Verify role profiles and that changing a user's role clears stale overrides.
          management_id=save_user(admin, {"username":"rolemanager","full_name":"Role Manager","password":"test-password","role":"MANAGEMENT","branch_id":""})
          sales_id=save_user(admin, {"username":"rolebranch","full_name":"Role Branch","password":"test-password","role":"SALES","branch_id":str(b2)})
          core.update_permissions(admin, {"roles":{"MANAGEMENT":{"VIEW_STOCK":True,"VIEW_REPORTS":False,"MANAGE_SETTINGS":True},"SALES":{"CREATE_SALE":True,"MANAGE_USERS":True}},"users":{}})
          mgmt={"id":management_id,"branch_id":None,"username":"rolemanager","full_name":"Role Manager","access_role":"MANAGEMENT","role":"SALES"}
          staff={"id":sales_id,"branch_id":b2,"username":"rolebranch","full_name":"Role Branch","access_role":"SALES","role":"SALES"}
          assert core.effective_permissions(mgmt)["VIEW_STOCK"] is True
          assert core.effective_permissions(mgmt)["VIEW_REPORTS"] is False
          assert core.effective_permissions(mgmt)["MANAGE_SETTINGS"] is False
          assert core.effective_permissions(staff)["CREATE_SALE"] is True
          assert core.effective_permissions(staff)["MANAGE_USERS"] is False
          c=core.db.c()
          c.execute("INSERT INTO user_permissions(user_id,key,enabled) VALUES(?,?,0)",(sales_id,"VIEW_STOCK"))
          c.commit(); c.close()
          admin_edit_user(admin, {"user_id":str(sales_id),"full_name":"Role Branch","role":"MANAGEMENT","active":"1","branch_id":str(b2)})
          c=core.db.c()
          role_row=c.execute("SELECT access_role,branch_id,home_branch_id FROM users WHERE id=?",(sales_id,)).fetchone()
          override_count=c.execute("SELECT COUNT(*) n FROM user_permissions WHERE user_id=?",(sales_id,)).fetchone()["n"]
          c.close()
          assert role_row["access_role"]=="MANAGEMENT" and role_row["home_branch_id"]==b2 and role_row["branch_id"]==b2
          assert override_count==0
          mgmt_staff={"id":sales_id,"branch_id":b2,"username":"rolebranch","full_name":"Role Branch","access_role":"MANAGEMENT","role":"SALES"}
          assert core.effective_permissions(mgmt_staff)["VIEW_STOCK"] is True
          try:
              admin_edit_user(admin, {"user_id":str(sales_id),"full_name":"Role Branch","role":"MANAGEMENT","active":"1","branch_id":str(b1)})
              raise AssertionError("A branch-bound account was moved to another branch.")
          except PermissionError:
              pass
          admin_edit_user(admin, {"user_id":str(sales_id),"full_name":"Role Branch","role":"SALES","active":"1","branch_id":str(b2)})
          c=core.db.c()
          role_row=c.execute("SELECT access_role,branch_id,home_branch_id FROM users WHERE id=?",(sales_id,)).fetchone()
          c.close()
          assert role_row["access_role"]=="SALES" and role_row["branch_id"]==b2 and role_row["home_branch_id"]==b2
          stock_transfer_action(user, {"action":"request","destination_branch_id":str(b1),"product_id":str(p),"qty":"10","reason":"Automated transfer approval test"})
          c = core.db.c()
          transfer_id = c.execute("SELECT id FROM stock_transfers WHERE source_branch_id=? AND destination_branch_id=? AND product_id=? AND status='PENDING' ORDER BY id DESC LIMIT 1",(b2,b1,p)).fetchone()["id"]
          c.close()
          stock_transfer_action(admin, {"action":"approve","transfer_id":str(transfer_id)})
          stock_count_adjustment(admin, {"branch_id":str(b2),"product_id":str(p),"physical_qty":"60","count_reason":"Automated physical stock count test"})
          c = core.db.c()
          q1 = c.execute("SELECT qty FROM branch_stock WHERE branch_id=? AND product_id=?",(b1,p)).fetchone()["qty"]
          q2 = c.execute("SELECT qty FROM branch_stock WHERE branch_id=? AND product_id=?",(b2,p)).fetchone()["qty"]
          c.close()
          assert (q1,q2)==(110,60), (q1,q2)
          report = core.stock_report("1900-01-01 00:00:00","2999-12-31 23:59:59",b2)
          product_row = next(row for row in report if row["sku"]=="TEST-001")
          assert (product_row["opening"],product_row["purchased"],product_row["sold"],product_row["adjustments"],product_row["closing"]) == (80,5,10,-15,60), product_row
          assert core.db.c().execute("SELECT COUNT(*) FROM suppliers WHERE branch_id=?",(b1,)).fetchone()[0] == 0
          print("PASS: Branch isolation, supplier directory branch scoping, opening/purchase/sale/closing reconciliation, COGS/gross profit, transfers, stock counts, settings persistence, permission profiles, role changes and permanent branch assignment.")
          PY
